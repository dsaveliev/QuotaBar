version: 2
updates:
  # The CI workflow pins actions by major version, so Dependabot is what moves
  # them forward - and it has to run weekly to notice a new major at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps